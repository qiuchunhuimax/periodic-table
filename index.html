<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Periodic Table</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --bg2: #111827;
  --bg3: #1e2a3a;
  --txt: #e2e8f0;
  --txt2: #94a3b8;
  --txt3: #64748b;
  --accent: #38bdf8;
  --border: rgba(148,163,184,0.12);

  --nonmetal:   #3b82f6;
  --noble:      #a855f7;
  --alkali:     #ef4444;
  --alkaline:   #f97316;
  --transition: #0891b2;
  --posttrans:  #6b7280;
  --metalloid:  #10b981;
  --lanthanide: #ec4899;
  --actinide:   #d97706;
  --unknown:    #475569;
}
:root[data-theme="light"] {
  --bg: #f0f4f8;
  --bg2: #ffffff;
  --bg3: #e2e8f0;
  --txt: #1e293b;
  --txt2: #475569;
  --txt3: #94a3b8;
  --accent: #0284c7;
  --border: rgba(30,41,59,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: 'IBM Plex Sans', sans-serif;
  min-height: 100vh;
  padding: 20px;
}
h1 {
  font-family: 'Space Mono', monospace;
  font-size: 22px;
  letter-spacing: -0.5px;
  color: var(--accent);
  margin-bottom: 4px;
}
.subtitle { font-size: 13px; color: var(--txt2); margin-bottom: 16px; }

#controls {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin-bottom: 14px;
}
#search {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--txt);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  width: 200px;
  outline: none;
  transition: border-color 0.2s;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--txt3); }
.filter-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--txt2);
  padding: 5px 11px;
  border-radius: 20px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { border-color: var(--accent); background: rgba(56,189,248,0.12); color: var(--accent); }

#pt-grid {
  display: grid;
  grid-template-columns: repeat(18, 1fr);
  gap: 2px;
  width: 100%;
}
.cell {
  aspect-ratio: 1;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 0.1s, opacity 0.2s, box-shadow 0.15s;
  border: 1px solid rgba(255,255,255,0.06);
}
.cell:hover {
  transform: scale(1.25);
  z-index: 20;
  box-shadow: 0 0 12px rgba(56,189,248,0.5);
  border-color: rgba(56,189,248,0.6);
}
.cell.selected {
  box-shadow: 0 0 0 2px var(--accent);
}
.cell.faded { opacity: 0.12; }
.cell .num { font-size: 6.5px; color: rgba(255,255,255,0.7); line-height: 1; font-family: 'Space Mono', monospace; }
.cell .sym { font-size: 12px; font-weight: 700; color: #fff; line-height: 1.1; font-family: 'Space Mono', monospace; }
.cell .nm  { font-size: 5px; color: rgba(255,255,255,0.65); line-height: 1; text-align: center; }
.period-lbl {
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--txt3); font-family: 'Space Mono', monospace;
}
.lan-ref, .act-ref {
  display: flex; align-items: center; justify-content: center;
  font-size: 7px; color: var(--txt3); border-radius: 3px;
  border: 1px dashed rgba(148,163,184,0.2);
}

#detail {
  margin-top: 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  min-height: 100px;
  display: flex;
  gap: 20px;
  align-items: flex-start;
}
.el-big {
  width: 72px; height: 72px;
  border-radius: 8px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.1);
}
.el-big .b-num { font-size: 10px; color: rgba(255,255,255,0.7); font-family: 'Space Mono', monospace; }
.el-big .b-sym { font-size: 26px; font-weight: 700; color: #fff; font-family: 'Space Mono', monospace; line-height: 1.1; }
.el-big .b-mass { font-size: 9px; color: rgba(255,255,255,0.65); font-family: 'Space Mono', monospace; }
.el-info { flex: 1; min-width: 0; }
.el-info h2 { font-size: 20px; font-weight: 600; color: var(--txt); margin-bottom: 2px; }
.el-info .cat-badge {
  display: inline-block;
  font-size: 10px; padding: 2px 8px; border-radius: 10px;
  background: rgba(56,189,248,0.12); color: var(--accent);
  margin-bottom: 8px; font-family: 'Space Mono', monospace;
}
.el-info .desc { font-size: 13px; color: var(--txt2); line-height: 1.6; margin-bottom: 10px; }
.props { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.prop { background: var(--bg3); border-radius: 6px; padding: 8px 10px; }
.prop .lbl { font-size: 10px; color: var(--txt3); margin-bottom: 3px; }
.prop .val { font-size: 13px; font-weight: 500; color: var(--txt); font-family: 'Space Mono', monospace; }

#legend {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin: 12px 0 0;
}
.leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--txt2); cursor: pointer; }
.leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.placeholder { font-size: 13px; color: var(--txt3); }

/* ── Editor Panel ── */
#theme-btn, #edit-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--txt2);
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
#theme-btn { margin-left: auto; }
#theme-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.08); }
#edit-btn:hover, #edit-btn.open { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.08); }

#editor-panel {
  display: none;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  gap: 16px;
}
#editor-panel.visible { display: block; }

.ed-tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.ed-tab {
  background: none; border: none; color: var(--txt3);
  font-size: 12px; font-family: inherit; cursor: pointer;
  padding: 4px 12px; border-radius: 6px; transition: all 0.15s;
}
.ed-tab:hover { color: var(--txt); background: var(--bg3); }
.ed-tab.active { color: var(--accent); background: rgba(56,189,248,0.1); }

.ed-pane { display: none; }
.ed-pane.active { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }

.ed-field { display: flex; flex-direction: column; gap: 5px; }
.ed-field label { font-size: 10px; color: var(--txt3); text-transform: uppercase; letter-spacing: 0.05em; }
.ed-field input[type=text], .ed-field select {
  background: var(--bg3); border: 1px solid var(--border); color: var(--txt);
  padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: inherit; outline: none;
}
.ed-field input[type=text]:focus, .ed-field select:focus { border-color: var(--accent); }
.ed-field input[type=color] {
  width: 100%; height: 32px; border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; background: var(--bg3); padding: 2px 4px;
}
.ed-field input[type=range] { width: 100%; accent-color: var(--accent); }
.ed-reset {
  background: none; border: 1px solid var(--border); color: var(--txt3);
  padding: 5px 14px; border-radius: 6px; font-size: 11px; font-family: inherit;
  cursor: pointer; transition: all 0.15s; margin-top: 4px;
}
.ed-reset:hover { border-color: #ef4444; color: #ef4444; }
</style>
</head>
<body>

<h1>Periodic Table</h1>
<p class="subtitle">118 elements · Click any element for details · Filter by category</p>

<div id="controls">
  <input id="search" type="text" placeholder="Search name, symbol, or number…" />
  <button class="filter-btn active" data-cat="all">All</button>
  <button class="filter-btn" data-cat="nonmetal">Nonmetal</button>
  <button class="filter-btn" data-cat="noble">Noble gas</button>
  <button class="filter-btn" data-cat="alkali">Alkali metal</button>
  <button class="filter-btn" data-cat="alkaline">Alkaline earth</button>
  <button class="filter-btn" data-cat="transition">Transition metal</button>
  <button class="filter-btn" data-cat="posttrans">Post-transition</button>
  <button class="filter-btn" data-cat="metalloid">Metalloid</button>
  <button class="filter-btn" data-cat="lanthanide">Lanthanide</button>
  <button class="filter-btn" data-cat="actinide">Actinide</button>
  <button id="theme-btn">☀ Light</button>
  <button id="edit-btn">✏ Edit</button>
</div>

<div id="editor-panel">
  <div class="ed-tabs">
    <button class="ed-tab active" data-pane="content">Content</button>
    <button class="ed-tab" data-pane="font">Font</button>
    <button class="ed-tab" data-pane="colors">Colors</button>
    <button class="ed-reset" onclick="resetAll()" style="margin-left:auto">Reset all</button>
  </div>

  <div class="ed-pane active" id="pane-content">
    <div class="ed-field" style="grid-column:1/-1">
      <label>Page Title</label>
      <input type="text" id="ed-title" value="Periodic Table" oninput="document.querySelector('h1').textContent=this.value" />
    </div>
    <div class="ed-field" style="grid-column:1/-1">
      <label>Subtitle</label>
      <input type="text" id="ed-subtitle" value="118 elements · Click any element for details · Filter by category" oninput="document.querySelector('.subtitle').textContent=this.value" />
    </div>
  </div>

  <div class="ed-pane" id="pane-font">
    <div class="ed-field">
      <label>UI Font</label>
      <select id="ed-font-body" onchange="applyFonts()">
        <option value="'IBM Plex Sans', sans-serif">IBM Plex Sans</option>
        <option value="'Inter', sans-serif">Inter</option>
        <option value="'Space Mono', monospace">Space Mono</option>
        <option value="system-ui, sans-serif">System UI</option>
        <option value="Georgia, serif">Georgia</option>
      </select>
    </div>
    <div class="ed-field">
      <label>Heading Font</label>
      <select id="ed-font-head" onchange="applyFonts()">
        <option value="'Space Mono', monospace">Space Mono</option>
        <option value="'IBM Plex Sans', sans-serif">IBM Plex Sans</option>
        <option value="'Inter', sans-serif">Inter</option>
        <option value="Georgia, serif">Georgia</option>
      </select>
    </div>
    <div class="ed-field">
      <label>Base font size: <span id="fs-val">16</span>px</label>
      <input type="range" id="ed-fontsize" min="12" max="22" value="16"
        oninput="document.getElementById('fs-val').textContent=this.value; document.body.style.fontSize=this.value+'px'" />
    </div>
  </div>

  <div class="ed-pane" id="pane-colors">
    <div class="ed-field"><label>Background</label><input type="color" id="c-bg" value="#0a0e17" oninput="setVar('--bg',this.value)"></div>
    <div class="ed-field"><label>Card BG</label><input type="color" id="c-bg2" value="#111827" oninput="setVar('--bg2',this.value)"></div>
    <div class="ed-field"><label>Accent</label><input type="color" id="c-accent" value="#38bdf8" oninput="setVar('--accent',this.value)"></div>
    <div class="ed-field"><label>Text</label><input type="color" id="c-txt" value="#e2e8f0" oninput="setVar('--txt',this.value)"></div>
    <div class="ed-field"><label>Nonmetal</label><input type="color" id="c-nonmetal" value="#3b82f6" oninput="setCatColor('nonmetal',this.value)"></div>
    <div class="ed-field"><label>Noble gas</label><input type="color" id="c-noble" value="#a855f7" oninput="setCatColor('noble',this.value)"></div>
    <div class="ed-field"><label>Alkali metal</label><input type="color" id="c-alkali" value="#ef4444" oninput="setCatColor('alkali',this.value)"></div>
    <div class="ed-field"><label>Alkaline earth</label><input type="color" id="c-alkaline" value="#f97316" oninput="setCatColor('alkaline',this.value)"></div>
    <div class="ed-field"><label>Transition</label><input type="color" id="c-transition" value="#0891b2" oninput="setCatColor('transition',this.value)"></div>
    <div class="ed-field"><label>Post-transition</label><input type="color" id="c-posttrans" value="#6b7280" oninput="setCatColor('posttrans',this.value)"></div>
    <div class="ed-field"><label>Metalloid</label><input type="color" id="c-metalloid" value="#10b981" oninput="setCatColor('metalloid',this.value)"></div>
    <div class="ed-field"><label>Lanthanide</label><input type="color" id="c-lanthanide" value="#ec4899" oninput="setCatColor('lanthanide',this.value)"></div>
    <div class="ed-field"><label>Actinide</label><input type="color" id="c-actinide" value="#d97706" oninput="setCatColor('actinide',this.value)"></div>
  </div>
</div>

<div id="pt-grid"></div>
<div id="legend"></div>
<div id="detail"><p class="placeholder">← Click any element to view its properties</p></div>

<script>
const CAT_COLORS = {
  nonmetal:'#3b82f6', noble:'#a855f7', alkali:'#ef4444',
  alkaline:'#f97316', transition:'#0891b2', posttrans:'#6b7280',
  metalloid:'#10b981', lanthanide:'#ec4899', actinide:'#d97706'
};
const CAT_LABEL = {
  nonmetal:'Nonmetal', noble:'Noble gas', alkali:'Alkali metal',
  alkaline:'Alkaline earth', transition:'Transition metal',
  posttrans:'Post-transition', metalloid:'Metalloid',
  lanthanide:'Lanthanide', actinide:'Actinide'
};

const ELEMENTS = [
  {n:1,sym:'H',name:'Hydrogen',cat:'nonmetal',mass:'1.008',row:1,col:1,phase:'Gas',group:'1',period:'1',config:'1s¹',desc:'The lightest and most abundant element in the universe. Forms water and is key to all organic chemistry.'},
  {n:2,sym:'He',name:'Helium',cat:'noble',mass:'4.003',row:1,col:18,phase:'Gas',group:'18',period:'1',config:'1s²',desc:'Second lightest element; chemically inert, used in balloons and as coolant for superconducting magnets.'},
  {n:3,sym:'Li',name:'Lithium',cat:'alkali',mass:'6.941',row:2,col:1,phase:'Solid',group:'1',period:'2',config:'[He] 2s¹',desc:'Softest metallic element; key component of lithium-ion batteries powering modern electronics.'},
  {n:4,sym:'Be',name:'Beryllium',cat:'alkaline',mass:'9.012',row:2,col:2,phase:'Solid',group:'2',period:'2',config:'[He] 2s²',desc:'Lightweight, stiff metal used in aerospace structures and X-ray transparent windows.'},
  {n:5,sym:'B',name:'Boron',cat:'metalloid',mass:'10.81',row:2,col:13,phase:'Solid',group:'13',period:'2',config:'[He] 2s² 2p¹',desc:'Metalloid used in glass, ceramics, and as a neutron absorber in nuclear reactors.'},
  {n:6,sym:'C',name:'Carbon',cat:'nonmetal',mass:'12.01',row:2,col:14,phase:'Solid',group:'14',period:'2',config:'[He] 2s² 2p²',desc:'Basis of all known life; exists as graphite, diamond, graphene, and fullerenes with wildly different properties.'},
  {n:7,sym:'N',name:'Nitrogen',cat:'nonmetal',mass:'14.01',row:2,col:15,phase:'Gas',group:'15',period:'2',config:'[He] 2s² 2p³',desc:'Comprises 78% of Earth\'s atmosphere; essential component of amino acids and DNA.'},
  {n:8,sym:'O',name:'Oxygen',cat:'nonmetal',mass:'16.00',row:2,col:16,phase:'Gas',group:'16',period:'2',config:'[He] 2s² 2p⁴',desc:'Essential for respiration and combustion; makes up 21% of Earth\'s atmosphere.'},
  {n:9,sym:'F',name:'Fluorine',cat:'nonmetal',mass:'19.00',row:2,col:17,phase:'Gas',group:'17',period:'2',config:'[He] 2s² 2p⁵',desc:'Most electronegative and reactive of all elements; used in Teflon and dental fluoride treatments.'},
  {n:10,sym:'Ne',name:'Neon',cat:'noble',mass:'20.18',row:2,col:18,phase:'Gas',group:'18',period:'2',config:'[He] 2s² 2p⁶',desc:'Chemically inert noble gas; gives off an orange-red glow in discharge tubes — the classic neon sign.'},

  {n:12,sym:'Mg',name:'Magnesium',cat:'alkaline',mass:'24.31',row:3,col:2,phase:'Solid',group:'2',period:'3',config:'[Ne] 3s²',desc:'Lightweight structural metal essential to chlorophyll; used in aerospace alloys and fireworks.'},
  {n:13,sym:'Al',name:'Aluminum',cat:'posttrans',mass:'26.98',row:3,col:13,phase:'Solid',group:'13',period:'3',config:'[Ne] 3s² 3p¹',desc:'Most abundant metal in Earth\'s crust; lightweight, corrosion-resistant, and endlessly recyclable.'},
  {n:14,sym:'Si',name:'Silicon',cat:'metalloid',mass:'28.09',row:3,col:14,phase:'Solid',group:'14',period:'3',config:'[Ne] 3s² 3p²',desc:'Backbone of the semiconductor industry; second most abundant element in Earth\'s crust by mass.'},
  {n:15,sym:'P',name:'Phosphorus',cat:'nonmetal',mass:'30.97',row:3,col:15,phase:'Solid',group:'15',period:'3',config:'[Ne] 3s² 3p³',desc:'Essential for DNA, RNA, and ATP; critical nutrient in fertilizers that sustains global agriculture.'},

  {n:18,sym:'Ar',name:'Argon',cat:'noble',mass:'39.95',row:3,col:18,phase:'Gas',group:'18',period:'3',config:'[Ne] 3s² 3p⁶',desc:'Most abundant noble gas on Earth; provides inert atmosphere for welding and incandescent lighting.'},

  {n:30,sym:'Zn',name:'Zinc',cat:'transition',mass:'65.38',row:4,col:12,phase:'Solid',group:'12',period:'4',config:'[Ar] 3d¹⁰ 4s²',desc:'Used to galvanize steel against rust; essential dietary mineral for immune function and wound healing.'},
  {n:31,sym:'Ga',name:'Gallium',cat:'posttrans',mass:'69.72',row:4,col:13,phase:'Solid',group:'13',period:'4',config:'[Ar] 3d¹⁰ 4s² 4p¹',desc:'Melts just above room temperature at 29.8°C; key in GaN semiconductors for LEDs and 5G chips.'},

const UNIQUE = [];
const seen = new Set();
ELEMENTS.forEach(e => { if (!seen.has(e.n)) { seen.add(e.n); UNIQUE.push(e); }});
UNIQUE.sort((a,b) => a.n - b.n);

const EL_BY_POS = {};
UNIQUE.forEach(e => { EL_BY_POS[`${e.row}-${e.col}`] = e; });

let activeFilter = 'all';
let activeSearch = '';
let selectedEl = null;

function isVisible(e) {
  const matchCat = activeFilter === 'all' || e.cat === activeFilter;
  const q = activeSearch;
  const matchQ = !q || e.name.toLowerCase().includes(q) || e.sym.toLowerCase().includes(q) || String(e.n).includes(q);
  return matchCat && matchQ;
}

function buildGrid() {
  const grid = document.getElementById('pt-grid');
  grid.innerHTML = '';

  for (let r = 1; r <= 9; r++) {
    for (let c = 1; c <= 18; c++) {
      if ((r === 8 || r === 9) && c === 1) {
        if (c === 1) {
          const sp = document.createElement('div');
          sp.style.cssText = `grid-column: 1 / 3; grid-row: ${r};`;
          grid.appendChild(sp);
          continue;
        }
      }
      if ((r === 8 || r === 9) && c === 2) continue;

      const el = EL_BY_POS[`${r}-${c}`];

      if (!el) {
        if (c === 3 && (r === 6 || r === 7)) {
          const ref = document.createElement('div');
          ref.className = r === 6 ? 'lan-ref' : 'act-ref';
          ref.style.cssText = `grid-column:${c}; grid-row:${r}; background:${r===6 ? CAT_COLORS.lanthanide : CAT_COLORS.actinide}22; border-color:${r===6 ? CAT_COLORS.lanthanide : CAT_COLORS.actinide}55;`;
          ref.innerHTML = `<span style="color:${r===6 ? CAT_COLORS.lanthanide : CAT_COLORS.actinide};font-size:7px;font-family:'Space Mono',monospace">${r===6?'57-71':'89-103'}</span>`;
          grid.appendChild(ref);
          continue;
        }
        const sp = document.createElement('div');
        sp.style.cssText = `grid-column:${c}; grid-row:${r};`;
        grid.appendChild(sp);
        continue;
      }

      const vis = isVisible(el);
      const div = document.createElement('div');
      div.className = 'cell' + (vis ? '' : ' faded') + (selectedEl && selectedEl.n === el.n ? ' selected' : '');
      div.style.cssText = `grid-column:${el.col}; grid-row:${el.row}; background:${CAT_COLORS[el.cat]}cc;`;
      div.innerHTML = `<span class="num">${el.n}</span><span class="sym">${el.sym}</span><span class="nm">${el.name.length > 8 ? el.name.slice(0,7)+'…' : el.name}</span>`;
      div.addEventListener('click', () => { selectedEl = el; buildGrid(); showDetail(el); });
      grid.appendChild(div);
    }
  }
}

function showDetail(el) {
  const color = CAT_COLORS[el.cat];
  document.getElementById('detail').innerHTML = `
    <div class="el-big" style="background:${color}cc;">
      <span class="b-num">${el.n}</span>
      <span class="b-sym">${el.sym}</span>
      <span class="b-mass">${el.mass}</span>
    </div>
    <div class="el-info">
      <h2>${el.name}</h2>
      <span class="cat-badge" style="background:${color}25;color:${color}">${CAT_LABEL[el.cat]}</span>
      <p class="desc">${el.desc}</p>
      <div class="props">
        <div class="prop"><div class="lbl">Atomic mass</div><div class="val">${el.mass}</div></div>
        <div class="prop"><div class="lbl">Phase (STP)</div><div class="val">${el.phase}</div></div>
        <div class="prop"><div class="lbl">Period</div><div class="val">${el.period}</div></div>
        <div class="prop"><div class="lbl">Group</div><div class="val">${el.group}</div></div>
        <div class="prop" style="grid-column:span 2"><div class="lbl">Electron configuration</div><div class="val" style="font-size:11px">${el.config}</div></div>
      </div>
    </div>
  `;
}

function buildLegend() {
  const leg = document.getElementById('legend');
  Object.entries(CAT_LABEL).forEach(([k,v]) => {
    const d = document.createElement('div');
    d.className = 'leg';
    d.innerHTML = `<div class="leg-dot" style="background:${CAT_COLORS[k]}"></div>${v}`;
    d.addEventListener('click', () => {
      activeFilter = activeFilter === k ? 'all' : k;
      document.querySelectorAll('.filter-btn').forEach(b => { b.classList.toggle('active', b.dataset.cat === activeFilter); });
      buildGrid();
    });
    leg.appendChild(d);
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === activeFilter));
    buildGrid();
  });
});
document.getElementById('search').addEventListener('input', e => {
  activeSearch = e.target.value.toLowerCase().trim();
  buildGrid();
});

buildGrid();
buildLegend();

// ── Editor panel ──
const DEFAULTS = {
  '--bg':'#0a0e17','--bg2':'#111827','--bg3':'#1e2a3a',
  '--txt':'#e2e8f0','--accent':'#38bdf8',
  nonmetal:'#3b82f6', noble:'#a855f7', alkali:'#ef4444',
  alkaline:'#f97316', transition:'#0891b2', posttrans:'#6b7280',
  metalloid:'#10b981', lanthanide:'#ec4899', actinide:'#d97706'
};

function setVar(name, value) {
  document.documentElement.style.setProperty(name, value);
}

function setCatColor(cat, value) {
  CAT_COLORS[cat] = value;
  buildGrid();
  buildLegend();
}

function applyFonts() {
  document.body.style.fontFamily = document.getElementById('ed-font-body').value;
  document.querySelectorAll('h1').forEach(el => el.style.fontFamily = document.getElementById('ed-font-head').value);
}

function resetAll() {
  // Reset CSS vars
  ['--bg','--bg2','--accent','--txt'].forEach(v => {
    setVar(v, DEFAULTS[v]);
    const id = 'c-' + v.replace('--','');
    if (document.getElementById(id)) document.getElementById(id).value = DEFAULTS[v];
  });
  // Reset category colors
  ['nonmetal','noble','alkali','alkaline','transition','posttrans','metalloid','lanthanide','actinide'].forEach(cat => {
    CAT_COLORS[cat] = DEFAULTS[cat];
    document.getElementById('c-'+cat).value = DEFAULTS[cat];
  });
  // Reset fonts
  document.body.style.fontFamily = '';
  document.body.style.fontSize = '';
  document.querySelectorAll('h1').forEach(el => el.style.fontFamily = '');
  document.getElementById('ed-font-body').value = "'IBM Plex Sans', sans-serif";
  document.getElementById('ed-font-head').value = "'Space Mono', monospace";
  document.getElementById('ed-fontsize').value = 16;
  document.getElementById('fs-val').textContent = 16;
  // Reset content
  document.querySelector('h1').textContent = 'Periodic Table';
  document.querySelector('.subtitle').textContent = '118 elements · Click any element for details · Filter by category';
  document.getElementById('ed-title').value = 'Periodic Table';
  document.getElementById('ed-subtitle').value = '118 elements · Click any element for details · Filter by category';
  buildGrid();
  buildLegend();
}

document.getElementById('theme-btn').addEventListener('click', function() {
  const root = document.documentElement;
  const isLight = root.getAttribute('data-theme') === 'light';
  root.setAttribute('data-theme', isLight ? 'dark' : 'light');
  this.textContent = isLight ? '☀ Light' : '☾ Dark';
});

document.getElementById('edit-btn').addEventListener('click', function() {
  const panel = document.getElementById('editor-panel');
  panel.classList.toggle('visible');
  this.classList.toggle('open');
});

document.querySelectorAll('.ed-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.ed-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.ed-pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('pane-' + tab.dataset.pane).classList.add('active');
  });
});
</script>
