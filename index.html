<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Periodic Table</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --bg2: #111827;
  --bg3: #1e2a3a;
  --txt: #e2e8f0;
  --txt2: #94a3b8;
  --txt3: #64748b;
  --accent: #38bdf8;
  --accent-soft: rgba(56,189,248,0.14);
  --border: rgba(148,163,184,0.12);
  --border-strong: rgba(226,232,240,0.18);
  --element-text: #ffffff;
  --element-muted: rgba(255,255,255,0.82);
  --element-subtle: rgba(255,255,255,0.68);
  --surface-shadow: 0 18px 50px rgba(0,0,0,0.22);
  --fs-body: 16px;
  --fs-title: 30px;
  --fs-subtitle: 15px;
  --fs-control: 13px;
  --fs-input: 15px;
  --fs-cell-num: 10px;
  --fs-cell-symbol: 22px;
  --fs-cell-name: 9px;
  --fs-ref: 10px;
  --fs-detail-symbol: 34px;
  --fs-detail-title: 24px;
  --fs-detail-body: 15px;
  --fs-detail-label: 12px;
  --fs-editor: 14px;

  --nonmetal:   #3b82f6;
  --noble:      #a855f7;
  --alkali:     #ef4444;
  --alkaline:   #f97316;
  --transition: #0891b2;
  --posttrans:  #6b7280;
  --metalloid:  #10b981;
  --lanthanide: #ec4899;
  --actinide:   #d97706;
  --unknown:    #475569;
}
:root[data-theme="light"] {
  --bg: #f6f8fb;
  --bg2: #ffffff;
  --bg3: #eef3f9;
  --txt: #0f172a;
  --txt2: #334155;
  --txt3: #64748b;
  --accent: #0369a1;
  --accent-soft: rgba(3,105,161,0.12);
  --border: rgba(15,23,42,0.16);
  --border-strong: rgba(15,23,42,0.24);
  --surface-shadow: 0 18px 42px rgba(15,23,42,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: 'IBM Plex Sans', sans-serif;
  min-height: 100vh;
  padding: 24px;
  font-size: var(--fs-body);
  line-height: 1.5;
}
h1 {
  font-family: 'Space Mono', monospace;
  font-size: var(--fs-title);
  letter-spacing: 0;
  color: var(--accent);
  margin-bottom: 6px;
}
.subtitle { font-size: var(--fs-subtitle); color: var(--txt2); margin-bottom: 18px; }

#controls {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  margin-bottom: 18px;
}
#search {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--txt);
  padding: 9px 13px;
  border-radius: 8px;
  font-size: var(--fs-input);
  font-family: inherit;
  width: min(280px, 100%);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#search::placeholder { color: var(--txt3); }
.filter-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--txt2);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: var(--fs-control);
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.filter-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

#pt-grid {
  display: grid;
  grid-template-columns: repeat(18, minmax(60px, 1fr));
  gap: 4px;
  width: max(100%, 1148px);
  overflow: visible;
}
.cell {
  aspect-ratio: 1;
  min-width: 60px;
  min-height: 60px;
  border-radius: 7px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  gap: 1px;
  padding: 4px 3px;
  transition: transform 0.1s, opacity 0.2s, box-shadow 0.15s, border-color 0.15s;
  border: 1px solid rgba(255,255,255,0.22);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 1px 2px rgba(0,0,0,0.14);
  text-shadow: 0 1px 1px rgba(0,0,0,0.28);
}
.cell:hover {
  transform: scale(1.12);
  z-index: 20;
  box-shadow: 0 10px 28px rgba(15,23,42,0.28), 0 0 0 3px var(--accent-soft);
  border-color: rgba(255,255,255,0.55);
}
.cell.selected {
  box-shadow: 0 0 0 3px var(--accent), 0 12px 28px rgba(15,23,42,0.26);
}
.cell.faded { opacity: 0.18; }
.cell .num {
  font-size: var(--fs-cell-num);
  color: var(--element-subtle);
  line-height: 1;
  font-family: 'Space Mono', monospace;
  align-self: flex-start;
}
.cell .sym {
  font-size: var(--fs-cell-symbol);
  font-weight: 700;
  color: var(--element-text);
  line-height: 1;
  font-family: 'Space Mono', monospace;
}
.cell .nm  {
  width: 100%;
  min-height: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--fs-cell-name);
  font-weight: 600;
  color: var(--element-muted);
  line-height: 1.15;
  text-align: center;
}
.period-lbl {
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-detail-label); color: var(--txt3); font-family: 'Space Mono', monospace;
}
.lan-ref, .act-ref {
  display: flex; align-items: center; justify-content: center;
  min-width: 60px;
  min-height: 60px;
  font-size: var(--fs-ref); color: var(--txt2); border-radius: 7px;
  border: 1px dashed var(--border-strong);
}

#detail {
  margin-top: 18px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px;
  min-height: 118px;
  display: flex;
  gap: 20px;
  align-items: flex-start;
  box-shadow: var(--surface-shadow);
}
.el-big {
  width: 92px; height: 92px;
  border-radius: 10px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.28);
  color: var(--element-text);
  text-shadow: 0 1px 1px rgba(0,0,0,0.28);
}
.el-big .b-num { font-size: var(--fs-detail-label); color: var(--element-subtle); font-family: 'Space Mono', monospace; }
.el-big .b-sym { font-size: var(--fs-detail-symbol); font-weight: 700; color: var(--element-text); font-family: 'Space Mono', monospace; line-height: 1.1; }
.el-big .b-mass { font-size: var(--fs-ref); color: var(--element-muted); font-family: 'Space Mono', monospace; }
.el-info { flex: 1; min-width: 0; }
.el-info h2 { font-size: var(--fs-detail-title); font-weight: 600; color: var(--txt); margin-bottom: 4px; }
.el-info .cat-badge {
  display: inline-block;
  font-size: var(--fs-detail-label); padding: 3px 9px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
  margin-bottom: 8px; font-family: 'Space Mono', monospace;
}
.el-info .desc { font-size: var(--fs-detail-body); color: var(--txt2); line-height: 1.65; margin-bottom: 12px; }
.props { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.prop { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.prop .lbl { font-size: var(--fs-detail-label); color: var(--txt3); margin-bottom: 4px; }
.prop .val { font-size: var(--fs-detail-body); font-weight: 600; color: var(--txt); font-family: 'Space Mono', monospace; overflow-wrap: anywhere; }

#legend {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin: 16px 0 0;
}
.leg { display: flex; align-items: center; gap: 6px; font-size: var(--fs-control); color: var(--txt2); cursor: pointer; }
.leg-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.35); }
.placeholder { font-size: var(--fs-detail-body); color: var(--txt3); }

/* ── Editor Panel ── */
#lang-btn, #theme-btn, #edit-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--txt2);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: var(--fs-control);
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
#lang-btn { margin-left: auto; }
#lang-btn:hover, #theme-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
#edit-btn:hover, #edit-btn.open { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

#editor-panel {
  display: none;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 18px;
  gap: 16px;
  box-shadow: var(--surface-shadow);
}
#editor-panel.visible { display: block; }

.ed-tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.ed-tab {
  background: none; border: none; color: var(--txt3);
  font-size: var(--fs-control); font-family: inherit; cursor: pointer;
  padding: 6px 12px; border-radius: 7px; transition: all 0.15s;
}
.ed-tab:hover { color: var(--txt); background: var(--bg3); }
.ed-tab.active { color: var(--accent); background: rgba(56,189,248,0.1); }

.ed-pane { display: none; }
.ed-pane.active { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }

.ed-field { display: flex; flex-direction: column; gap: 5px; }
.ed-field label { font-size: var(--fs-ref); color: var(--txt3); text-transform: uppercase; letter-spacing: 0.05em; }
.ed-field input[type=text], .ed-field select {
  background: var(--bg3); border: 1px solid var(--border); color: var(--txt);
  padding: 8px 10px; border-radius: 7px; font-size: var(--fs-editor); font-family: inherit; outline: none;
}
.ed-field input[type=text]:focus, .ed-field select:focus { border-color: var(--accent); }
.ed-field input[type=color] {
  width: 100%; height: 32px; border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; background: var(--bg3); padding: 2px 4px;
}
.ed-field input[type=range] { width: 100%; accent-color: var(--accent); }
.font-size-control {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
}
.fs-step {
  width: 38px;
  height: 34px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg3);
  color: var(--txt);
  font-family: inherit;
  font-size: var(--fs-control);
  font-weight: 700;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.fs-step:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.ed-reset {
  background: none; border: 1px solid var(--border); color: var(--txt3);
  padding: 7px 14px; border-radius: 7px; font-size: var(--fs-control); font-family: inherit;
  cursor: pointer; transition: all 0.15s; margin-top: 4px;
}
.ed-reset:hover { border-color: #ef4444; color: #ef4444; }

@media (max-width: 1200px) {
  body { padding: 18px; overflow-x: auto; }
}

@media (max-width: 760px) {
  body { padding: 14px; }
  h1 { font-size: max(26px, var(--fs-title)); }
  #controls { align-items: stretch; }
  #search { width: 100%; }
  #lang-btn { margin-left: 0; }
  #detail { flex-direction: column; padding: 16px; }
  .props { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<h1>Periodic Table</h1>
<p class="subtitle">118 elements · Click any element for details · Filter by category</p>

<div id="controls">
  <input id="search" type="text" placeholder="Search name, symbol, or number…" />
  <button class="filter-btn active" data-cat="all">All</button>
  <button class="filter-btn" data-cat="nonmetal">Nonmetal</button>
  <button class="filter-btn" data-cat="noble">Noble gas</button>
  <button class="filter-btn" data-cat="alkali">Alkali metal</button>
  <button class="filter-btn" data-cat="alkaline">Alkaline earth</button>
  <button class="filter-btn" data-cat="transition">Transition metal</button>
  <button class="filter-btn" data-cat="posttrans">Post-transition</button>
  <button class="filter-btn" data-cat="metalloid">Metalloid</button>
  <button class="filter-btn" data-cat="lanthanide">Lanthanide</button>
  <button class="filter-btn" data-cat="actinide">Actinide</button>
  <button id="lang-btn">中文</button>
  <button id="theme-btn">☀ Light</button>
  <button id="edit-btn">✏ Edit</button>
</div>

<div id="editor-panel">
  <div class="ed-tabs">
    <button class="ed-tab active" data-pane="content">Content</button>
    <button class="ed-tab" data-pane="font">Font</button>
    <button class="ed-tab" data-pane="colors">Colors</button>
    <button class="ed-reset" onclick="resetAll()" style="margin-left:auto">Reset all</button>
  </div>

  <div class="ed-pane active" id="pane-content">
    <div class="ed-field" style="grid-column:1/-1">
      <label>Page Title</label>
      <input type="text" id="ed-title" value="Periodic Table" oninput="document.querySelector('h1').textContent=this.value" />
    </div>
    <div class="ed-field" style="grid-column:1/-1">
      <label>Subtitle</label>
      <input type="text" id="ed-subtitle" value="118 elements · Click any element for details · Filter by category" oninput="document.querySelector('.subtitle').textContent=this.value" />
    </div>
  </div>

  <div class="ed-pane" id="pane-font">
    <div class="ed-field">
      <label>UI Font</label>
      <select id="ed-font-body" onchange="applyFonts()">
        <option value="'IBM Plex Sans', sans-serif">IBM Plex Sans</option>
        <option value="'Inter', sans-serif">Inter</option>
        <option value="'Space Mono', monospace">Space Mono</option>
        <option value="system-ui, sans-serif">System UI</option>
        <option value="Georgia, serif">Georgia</option>
      </select>
    </div>
    <div class="ed-field">
      <label>Heading Font</label>
      <select id="ed-font-head" onchange="applyFonts()">
        <option value="'Space Mono', monospace">Space Mono</option>
        <option value="'IBM Plex Sans', sans-serif">IBM Plex Sans</option>
        <option value="'Inter', sans-serif">Inter</option>
        <option value="Georgia, serif">Georgia</option>
      </select>
    </div>
    <div class="ed-field">
      <label>Base font size: <span id="fs-val">16</span>px</label>
      <div class="font-size-control">
        <button type="button" class="fs-step" data-step="-1">A-</button>
        <input type="range" id="ed-fontsize" min="14" max="24" value="16" />
        <button type="button" class="fs-step" data-step="1">A+</button>
      </div>
    </div>
  </div>

  <div class="ed-pane" id="pane-colors">
    <div class="ed-field"><label>Background</label><input type="color" id="c-bg" value="#0a0e17" oninput="setVar('--bg',this.value)"></div>
    <div class="ed-field"><label>Card BG</label><input type="color" id="c-bg2" value="#111827" oninput="setVar('--bg2',this.value)"></div>
    <div class="ed-field"><label>Accent</label><input type="color" id="c-accent" value="#38bdf8" oninput="setVar('--accent',this.value)"></div>
    <div class="ed-field"><label>Text</label><input type="color" id="c-txt" value="#e2e8f0" oninput="setVar('--txt',this.value)"></div>
    <div class="ed-field"><label>Nonmetal</label><input type="color" id="c-nonmetal" value="#3b82f6" oninput="setCatColor('nonmetal',this.value)"></div>
    <div class="ed-field"><label>Noble gas</label><input type="color" id="c-noble" value="#a855f7" oninput="setCatColor('noble',this.value)"></div>
    <div class="ed-field"><label>Alkali metal</label><input type="color" id="c-alkali" value="#ef4444" oninput="setCatColor('alkali',this.value)"></div>
    <div class="ed-field"><label>Alkaline earth</label><input type="color" id="c-alkaline" value="#f97316" oninput="setCatColor('alkaline',this.value)"></div>
    <div class="ed-field"><label>Transition</label><input type="color" id="c-transition" value="#0891b2" oninput="setCatColor('transition',this.value)"></div>
    <div class="ed-field"><label>Post-transition</label><input type="color" id="c-posttrans" value="#6b7280" oninput="setCatColor('posttrans',this.value)"></div>
    <div class="ed-field"><label>Metalloid</label><input type="color" id="c-metalloid" value="#10b981" oninput="setCatColor('metalloid',this.value)"></div>
    <div class="ed-field"><label>Lanthanide</label><input type="color" id="c-lanthanide" value="#ec4899" oninput="setCatColor('lanthanide',this.value)"></div>
    <div class="ed-field"><label>Actinide</label><input type="color" id="c-actinide" value="#d97706" oninput="setCatColor('actinide',this.value)"></div>
  </div>
</div>

<div id="pt-grid"></div>
<div id="legend"></div>
<div id="detail"><p class="placeholder">← Click any element to view its properties</p></div>

  {n:104,sym:'Rf',name:'Rutherfordium',cat:'transition',mass:'(267)',row:7,col:4,phase:'Solid',group:'4',period:'7',config:'[Rn] 5f¹⁴ 6d² 7s²',desc:'Named after Ernest Rutherford; first transactinide element, produced one atom at a time.'},
  {n:105,sym:'Db',name:'Dubnium',cat:'transition',mass:'(268)',row:7,col:5,phase:'Solid',group:'5',period:'7',config:'[Rn] 5f¹⁴ 6d³ 7s²',desc:'Named after Dubna, Russia; discovered independently by US and Soviet teams during the Cold War.'},
  {n:106,sym:'Sg',name:'Seaborgium',cat:'transition',mass:'(269)',row:7,col:6,phase:'Solid',group:'6',period:'7',config:'[Rn] 5f¹⁴ 6d⁴ 7s²',desc:'Named after Glenn Seaborg; the first element named after a living person, while he was still alive.'},

  {n:115,sym:'Mc',name:'Moscovium',cat:'posttrans',mass:'(290)',row:7,col:15,phase:'Solid',group:'15',period:'7',config:'[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p³',desc:'Named after Moscow Oblast, Russia; confirmed by IUPAC in 2016.'},

  {n:117,sym:'Ts',name:'Tennessine',cat:'nonmetal',mass:'(294)',row:7,col:17,phase:'Solid',group:'17',period:'7',config:'[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁵',desc:'Named after Tennessee; the second-heaviest element confirmed, joining the halogen group.'},
  {n:118,sym:'Og',name:'Oganesson',cat:'noble',mass:'(294)',row:7,col:18,phase:'Unknown',group:'18',period:'7',config:'[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁶',desc:'Named after Yuri Oganessian; heaviest element known; theoretically may be solid, not a gas like other noble gases.'},
];

const UNIQUE = [];
const seen = new Set();
ELEMENTS.forEach(e => { if (!seen.has(e.n)) { seen.add(e.n); UNIQUE.push(e); }});
UNIQUE.sort((a,b) => a.n - b.n);

const EL_BY_POS = {};
UNIQUE.forEach(e => { EL_BY_POS[`${e.row}-${e.col}`] = e; });

let activeFilter = 'all';
let activeSearch = '';
let selectedEl = null;

function isVisible(e) {
  const matchCat = activeFilter === 'all' || e.cat === activeFilter;
  const q = activeSearch;
  const matchQ = !q || e.name.toLowerCase().includes(q) || e.sym.toLowerCase().includes(q) || String(e.n).includes(q);
  return matchCat && matchQ;
}

function buildGrid() {
  const grid = document.getElementById('pt-grid');
  grid.innerHTML = '';

  for (let r = 1; r <= 9; r++) {
    for (let c = 1; c <= 18; c++) {
      if ((r === 8 || r === 9) && c === 1) {
        if (c === 1) {
          const sp = document.createElement('div');
          sp.style.cssText = `grid-column: 1 / 3; grid-row: ${r};`;
          grid.appendChild(sp);
          continue;
        }
      }
      if ((r === 8 || r === 9) && c === 2) continue;

      const el = EL_BY_POS[`${r}-${c}`];

      if (!el) {
        if (c === 3 && (r === 6 || r === 7)) {
          const ref = document.createElement('div');
          ref.className = r === 6 ? 'lan-ref' : 'act-ref';
          ref.style.cssText = `grid-column:${c}; grid-row:${r}; background:${r===6 ? CAT_COLORS.lanthanide : CAT_COLORS.actinide}22; border-color:${r===6 ? CAT_COLORS.lanthanide : CAT_COLORS.actinide}55;`;
          ref.innerHTML = `<span style="color:${r===6 ? CAT_COLORS.lanthanide : CAT_COLORS.actinide};font-size:var(--fs-ref);font-weight:700;font-family:'Space Mono',monospace">${r===6?'57-71':'89-103'}</span>`;
          grid.appendChild(ref);
          continue;
        }
        const sp = document.createElement('div');
        sp.style.cssText = `grid-column:${c}; grid-row:${r};`;
        grid.appendChild(sp);
        continue;
      }

      const vis = isVisible(el);
      const div = document.createElement('div');
      div.className = 'cell' + (vis ? '' : ' faded') + (selectedEl && selectedEl.n === el.n ? ' selected' : '');
      div.style.cssText = `grid-column:${el.col}; grid-row:${el.row}; background:${CAT_COLORS[el.cat]}e6;`;
      div.title = `${el.n} ${el.sym} ${lang === 'zh' ? CN_NAMES[el.n] + ' / ' : ''}${el.name}`;
      div.setAttribute('aria-label', div.title);
      const nm = lang === 'zh' ? CN_NAMES[el.n] : (el.name.length > 10 ? el.name.slice(0,9)+'…' : el.name);
      div.innerHTML = `<span class="num">${el.n}</span><span class="sym">${el.sym}</span><span class="nm">${nm}</span>`;
      div.addEventListener('click', () => { selectedEl = el; buildGrid(); showDetail(el); });
      grid.appendChild(div);
    }
  }
}

function showDetail(el) {
  const color = CAT_COLORS[el.cat];
  const ui = lang === 'zh' ? UI_ZH : UI_EN;
  const catLabel = lang === 'zh' ? CAT_LABEL_ZH[el.cat] : CAT_LABEL[el.cat];
  const elName = lang === 'zh' ? `${CN_NAMES[el.n]} ${el.name}` : el.name;
  document.getElementById('detail').innerHTML = `
    <div class="el-big" style="background:${color}e6;">
      <span class="b-num">${el.n}</span>
      <span class="b-sym">${el.sym}</span>
      <span class="b-mass">${el.mass}</span>
    </div>
    <div class="el-info">
      <h2>${elName}</h2>
      <span class="cat-badge" style="background:${color}25;color:${color}">${catLabel}</span>
      <p class="desc">${el.desc}</p>
      <div class="props">
        <div class="prop"><div class="lbl">${ui.mass}</div><div class="val">${el.mass}</div></div>
        <div class="prop"><div class="lbl">${ui.phase}</div><div class="val">${el.phase}</div></div>
        <div class="prop"><div class="lbl">${ui.period}</div><div class="val">${el.period}</div></div>
        <div class="prop"><div class="lbl">${ui.group}</div><div class="val">${el.group}</div></div>
        <div class="prop" style="grid-column:span 2"><div class="lbl">${ui.config}</div><div class="val" style="font-size:var(--fs-control)">${el.config}</div></div>
      </div>
    </div>
  `;
}

function buildLegend() {
  const leg = document.getElementById('legend');
  leg.innerHTML = '';
  const labels = lang === 'zh' ? CAT_LABEL_ZH : CAT_LABEL;
  Object.entries(labels).forEach(([k,v]) => {
    const d = document.createElement('div');
    d.className = 'leg';
    d.innerHTML = `<div class="leg-dot" style="background:${CAT_COLORS[k]}"></div>${v}`;
    d.addEventListener('click', () => {
      activeFilter = activeFilter === k ? 'all' : k;
      document.querySelectorAll('.filter-btn').forEach(b => { b.classList.toggle('active', b.dataset.cat === activeFilter); });
      buildGrid();
    });
    leg.appendChild(d);
  });
}

function applyLang() {
  const ui = lang === 'zh' ? UI_ZH : UI_EN;
  document.querySelector('h1').textContent = ui.title;
  document.querySelector('.subtitle').textContent = ui.subtitle;
  document.getElementById('search').placeholder = ui.search;
  document.querySelector('.filter-btn[data-cat="all"]').textContent = ui.all;
  document.getElementById('ed-title').value = ui.title;
  document.getElementById('ed-subtitle').value = ui.subtitle;
  const ph = document.querySelector('#detail .placeholder');
  if (ph) ph.textContent = ui.placeholder;
  buildGrid();
  buildLegend();
  if (selectedEl) showDetail(selectedEl);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === activeFilter));
    buildGrid();
  });
});
document.getElementById('search').addEventListener('input', e => {
  activeSearch = e.target.value.toLowerCase().trim();
  buildGrid();
});

buildGrid();
buildLegend();

// ── Editor panel ──
const DEFAULTS = {
  '--bg':'#0a0e17','--bg2':'#111827','--bg3':'#1e2a3a',
  '--txt':'#e2e8f0','--accent':'#38bdf8',
  nonmetal:'#3b82f6', noble:'#a855f7', alkali:'#ef4444',
  alkaline:'#f97316', transition:'#0891b2', posttrans:'#6b7280',
  metalloid:'#10b981', lanthanide:'#ec4899', actinide:'#d97706'
};

function setVar(name, value) {
  document.documentElement.style.setProperty(name, value);
}

function setCatColor(cat, value) {
  CAT_COLORS[cat] = value;
  buildGrid();
  buildLegend();
}

function applyFonts() {
  document.body.style.fontFamily = document.getElementById('ed-font-body').value;
  document.querySelectorAll('h1').forEach(el => el.style.fontFamily = document.getElementById('ed-font-head').value);
}

const FONT_SIZE_BASES = {
  '--fs-body': 16,
  '--fs-title': 30,
  '--fs-subtitle': 15,
  '--fs-control': 13,
  '--fs-input': 15,
  '--fs-cell-num': 10,
  '--fs-cell-symbol': 22,
  '--fs-cell-name': 9,
  '--fs-ref': 10,
  '--fs-detail-symbol': 34,
  '--fs-detail-title': 24,
  '--fs-detail-body': 15,
  '--fs-detail-label': 12,
  '--fs-editor': 14
};

function applyFontSize(value) {
  const baseSize = Number(value);
  const scale = baseSize / 16;
  const root = document.documentElement;
  Object.entries(FONT_SIZE_BASES).forEach(([name, base]) => {
    const scaled = Math.max(8, base * scale);
    root.style.setProperty(name, `${scaled.toFixed(1)}px`);
  });
  document.getElementById('fs-val').textContent = String(baseSize);
}

const fontSizeSlider = document.getElementById('ed-fontsize');
['input', 'change'].forEach(eventName => {
  fontSizeSlider.addEventListener(eventName, () => applyFontSize(fontSizeSlider.value));
});
document.querySelectorAll('.fs-step').forEach(button => {
  button.addEventListener('click', () => {
    const step = Number(button.dataset.step);
    const next = Math.min(Number(fontSizeSlider.max), Math.max(Number(fontSizeSlider.min), Number(fontSizeSlider.value) + step));
    fontSizeSlider.value = String(next);
    applyFontSize(next);
  });
});
applyFontSize(fontSizeSlider.value);

function resetAll() {
  // Reset CSS vars
  ['--bg','--bg2','--accent','--txt'].forEach(v => {
    setVar(v, DEFAULTS[v]);
    const id = 'c-' + v.replace('--','');
    if (document.getElementById(id)) document.getElementById(id).value = DEFAULTS[v];
  });
  // Reset category colors
  ['nonmetal','noble','alkali','alkaline','transition','posttrans','metalloid','lanthanide','actinide'].forEach(cat => {
    CAT_COLORS[cat] = DEFAULTS[cat];
    document.getElementById('c-'+cat).value = DEFAULTS[cat];
  });
  // Reset fonts
  document.body.style.fontFamily = '';
  document.querySelectorAll('h1').forEach(el => el.style.fontFamily = '');
  document.getElementById('ed-font-body').value = "'IBM Plex Sans', sans-serif";
  document.getElementById('ed-font-head').value = "'Space Mono', monospace";
  document.getElementById('ed-fontsize').value = 16;
  applyFontSize(16);
  // Reset content
  document.querySelector('h1').textContent = 'Periodic Table';
  document.querySelector('.subtitle').textContent = '118 elements · Click any element for details · Filter by category';
  document.getElementById('ed-title').value = 'Periodic Table';
  document.getElementById('ed-subtitle').value = '118 elements · Click any element for details · Filter by category';
  buildGrid();
  buildLegend();
}

document.getElementById('lang-btn').addEventListener('click', function() {
  lang = lang === 'en' ? 'zh' : 'en';
  this.textContent = lang === 'zh' ? 'EN' : '中文';
  applyLang();
});

document.getElementById('theme-btn').addEventListener('click', function() {
  const root = document.documentElement;
  const isLight = root.getAttribute('data-theme') === 'light';
  root.setAttribute('data-theme', isLight ? 'dark' : 'light');
  this.textContent = isLight ? '☀ Light' : '☾ Dark';
});

document.getElementById('edit-btn').addEventListener('click', function() {
  const panel = document.getElementById('editor-panel');
  panel.classList.toggle('visible');
  this.classList.toggle('open');
});

document.querySelectorAll('.ed-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.ed-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.ed-pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('pane-' + tab.dataset.pane).classList.add('active');
  });
});
</script>
</body>
